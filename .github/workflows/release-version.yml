name: Release Version

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install
        run: |
          npm ci
      - name: Release Version
        id: release-version
        run: |
          npm run version-updater
      # The build reads the version from package.json, so it runs after the bump
      - name: Build
        env:
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          npm run build
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        env:
          NEW_VERSION: ${{ steps.release-version.outputs.newVersion }}
          CHANGES: ${{ steps.release-version.outputs.changes }}
        with:
          commit-message: Bump ${{ env.NEW_VERSION }}
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          title: Bump ${{ env.NEW_VERSION }}
          body: |
            # New Version ${{ env.NEW_VERSION }}

            ## Changes
            ${{ env.CHANGES }}
          labels: |
            BUMP
          branch: "version_bump/${{ env.NEW_VERSION }}"
          branch-suffix: timestamp
          delete-branch: true
